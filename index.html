<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#08152b;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:linear-gradient(160deg,#6536c9,#2e8fd4 52%,#42c6a1);overflow:hidden}
#menu:before,#menu:after{content:"";position:absolute;border-radius:50%;background:#ffffff18}
#menu:before{width:280px;height:280px;left:-100px;top:-80px}#menu:after{width:360px;height:360px;right:-150px;bottom:-160px}
.panel{position:relative;z-index:1;width:min(760px,97vw);max-height:96vh;overflow:auto;background:linear-gradient(180deg,#172a57f2,#10203ff2);border:3px solid #ffffff45;border-radius:28px;padding:16px;box-shadow:0 12px 40px #08152b66}
.hero{text-align:center;padding:4px 4px 12px}.logo{font-size:clamp(38px,10vw,62px);font-weight:1000;letter-spacing:2px;line-height:.95;text-shadow:0 5px 0 #54288e,0 8px 18px #0006}.hero-icons{font-size:26px;letter-spacing:8px;margin:8px 0 2px}.tag{opacity:.9;margin:5px 0 12px;font-weight:700}.section{background:#ffffff0d;border:1px solid #ffffff20;border-radius:18px;padding:11px;margin-top:10px}.section-title{font-weight:900;font-size:17px;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card,.level{min-height:58px;border:2px solid #ffffff2d;background:linear-gradient(#294c79,#1e385e);color:white;border-radius:15px;padding:8px 5px;text-align:center;font-weight:750;box-shadow:inset 0 1px #ffffff25}
.card.sel,.level.sel{border-color:#ffe45e;box-shadow:0 0 0 2px #ffe45e35,inset 0 1px #fff6}.card.locked,.level.locked{opacity:.32}
button{font:inherit}.primary{width:100%;margin-top:14px;padding:16px;border:0;border-radius:18px;background:linear-gradient(#fff06a,#ffc93f);color:#382f18;font-weight:1000;font-size:21px;box-shadow:0 6px 0 #d99022,0 10px 20px #0004}.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #d99022}
.tip{text-align:center;font-size:13px;opacity:.8;margin-top:12px}
#hud{position:fixed;top:10px;left:10px;right:10px;display:none;z-index:3;background:#08152bbb;border-radius:12px;padding:8px 12px;font-weight:800}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);display:none;background:#08152be8;padding:12px 18px;border-radius:12px;z-index:4}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}.panel{padding:12px}.card,.level{min-height:54px}}

#game{touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
</style>

function ground(){return H*.79}
function bg(){
 let w=world(), skies=[["#65ccff","#eafaff"],["#07142f","#273e72"],["#20142e","#725b82"],["#63c8ff","#e9fbff"],["#211044","#8953a8"]],g=X.createLinearGradient(0,0,0,H);
 g.addColorStop(0,skies[w][0]);g.addColorStop(.72,skies[w][1]);X.fillStyle=g;X.fillRect(0,0,W,H);
 if(w===0){
   // Theme park side-scrolling skyline.
   X.save();X.translate(W*.17,H*.42);X.strokeStyle="#fff";X.lineWidth=4;X.beginPath();X.arc(0,0,58,0,Math.PI*2);X.stroke();
   for(let q=0;q<8;q++){let a=q*Math.PI/4;X.beginPath();X.moveTo(0,0);X.lineTo(Math.cos(a)*58,Math.sin(a)*58);X.stroke();X.fillStyle=["#ff5d7a","#ffd64e","#54d6ff","#9b6dff"][q%4];X.fillRect(Math.cos(a)*58-6,Math.sin(a)*58-5,12,10)}
   X.beginPath();X.moveTo(0,0);X.lineTo(-32,82);X.moveTo(0,0);X.lineTo(32,82);X.stroke();X.restore();
   X.strokeStyle="#ef4e68";X.lineWidth=6;X.beginPath();X.moveTo(W*.38,H*.48);X.bezierCurveTo(W*.52,H*.22,W*.62,H*.58,W*.76,H*.34);X.bezierCurveTo(W*.86,H*.18,W*.92,H*.48,W,H*.31);X.stroke();
   X.fillStyle="#8269db";X.fillRect(W*.78,H*.43,W*.15,H*.17);X.fillStyle="#ffd34e";X.beginPath();X.moveTo(W*.77,H*.43);X.lineTo(W*.82,H*.33);X.lineTo(W*.87,H*.43);X.fill();X.beginPath();X.moveTo(W*.86,H*.43);X.lineTo(W*.91,H*.31);X.lineTo(W*.96,H*.43);X.fill();
 } else if(w===1){X.fillStyle="#fff";for(let i=0;i<35;i++)X.fillRect((i*79)%W,(i*43)%(H*.5),2,2);X.fillStyle="#182746";for(let x=0;x<W;x+=75)X.fillRect(x,H*.42-(x%150)/5,55,H*.3)}
 else if(w===2){X.fillStyle="#ffffffbb";for(let i=0;i<8;i++){X.font="38px serif";X.fillText("👻",(i*97+frame*.18)%W,H*.28+(i%3)*42)}}
 else if(w===3){X.fillStyle="#dfe8ef";X.fillRect(0,H*.34,W,H*.26);X.fillStyle="#66798c";for(let x=8;x<W;x+=18)for(let y=H*.36;y<H*.56;y+=14)X.fillRect(x,y,4,4);X.fillStyle="#fff";X.font="900 20px system-ui";X.fillText("REBOUND STADIUM",W*.36,H*.41)}
 else {X.fillStyle="#fff";for(let i=0;i<30;i++)X.fillRect((i*91)%W,(i*53)%(H*.5),2,2);X.fillStyle="#5ce1d1";X.beginPath();X.arc(W*.82,H*.2,48,0,Math.PI*2);X.fill()}
 // Side-on road across the phone.
 X.fillStyle=w===3?"#388c4d":"#4a5058";X.fillRect(0,ground(),W,H-ground());
 X.fillStyle="#d8dadd";X.fillRect(0,ground(),W,6);X.fillStyle="#fff";
 for(let x=-(dist%120);x<W;x+=120)X.fillRect(x,ground()+58,62,5);
 X.fillStyle="rgba(255,255,255,.92)";X.font="900 15px system-ui";X.fillText(["THEME PARK","NIGHT RUN","GHOST WORLD","SOCCER WORLD","ALIEN WORLD"][w]+" • LEVEL "+level,14,27);
}
function drawMainRunner(x,y,phase,scale=.82){
 X.save();X.translate(x,y);let st=Math.sin(phase),bob=Math.abs(Math.sin(phase*2))*2;X.translate(0,-bob);X.rotate(-.07);X.scale(scale,scale);
 // legs sprinting
 X.strokeStyle="#18395f";X.lineWidth=9;X.lineCap="round";X.beginPath();X.moveTo(23,62);X.lineTo(23+st*17,78);X.lineTo(10+st*34,95);X.stroke();
 X.beginPath();X.moveTo(35,62);X.lineTo(35-st*17,78);X.lineTo(46-st*34,95);X.stroke();
 X.strokeStyle="#17202b";X.lineWidth=7;X.beginPath();X.moveTo(10+st*34,95);X.lineTo(22+st*34,95);X.moveTo(46-st*34,95);X.lineTo(58-st*34,95);X.stroke();
 // blue + green dress
 X.fillStyle="#207fbd";X.beginPath();X.moveTo(12,30);X.lineTo(43,30);X.lineTo(39,63);X.lineTo(16,63);X.closePath();X.fill();
 X.fillStyle="#39b96b";X.beginPath();X.moveTo(15,56);X.lineTo(40,56);X.lineTo(48,73);X.lineTo(7,73);X.closePath();X.fill();
 // pumping arms
 X.strokeStyle="#e8b894";X.lineWidth=7;X.beginPath();X.moveTo(14,34);X.lineTo(2-st*15,50);X.lineTo(10-st*18,59);X.stroke();X.beginPath();X.moveTo(42,34);X.lineTo(53+st*15,47);X.lineTo(47+st*18,57);X.stroke();
 // use supplied photo as face
 X.save();X.beginPath();X.arc(28,17,17,0,Math.PI*2);X.clip();if(faceImg.complete)X.drawImage(faceImg,8,-3,40,40);X.restore();
 // blonde hair + tiara around photo
 X.strokeStyle="#e4c776";X.lineWidth=5;X.beginPath();X.arc(28,16,19,Math.PI*1.02,Math.PI*1.92);X.stroke();
 X.fillStyle="#ffd84d";X.beginPath();X.moveTo(14,0);X.lineTo(19,-8);X.lineTo(25,0);X.lineTo(31,-9);X.lineTo(39,0);X.closePath();X.fill();
 X.restore();
}
function drawOtherRunner(x,y,i,phase,scale=.82){X.save();X.translate(x,y);let st=Math.sin(phase);X.scale(scale,scale);X.strokeStyle="#29334b";X.lineWidth=9;X.lineCap="round";X.beginPath();X.moveTo(20,55);X.lineTo(10+st*28,91);X.moveTo(34,55);X.lineTo(45-st*28,91);X.stroke();X.fillStyle=outfit[i];X.fillRect(10,25,34,38);X.fillStyle="#e5b38e";X.beginPath();X.arc(27,13,14,0,Math.PI*2);X.fill();X.fillStyle=hair[i];X.beginPath();X.arc(27,8,15,Math.PI,Math.PI*2);X.fill();X.restore()}
function drawRunner(x,y,i,p,sc=.82){if(i===0)drawMainRunner(x,y,p,sc);else drawOtherRunner(x,y,i,p,sc)}
function obstacleType(){let a=[["cone","hurdle","balloon"],["barrier","bat","hurdle"],["ghost","grave","gate"],["ball","goal","hurdle"],["alien","crystal","laser"]][world()];return a[Math.floor(Math.random()*a.length)]}
function spawn(){let type=Math.random()<.34?"coin":obstacleType();objects.push({x:W+60,type})}
function drawObj(o){
 let y=ground();
 if(o.type==="coin"){X.fillStyle="#f6c945";X.beginPath();X.arc(o.x,y-48,15,0,Math.PI*2);X.fill();X.fillStyle="#7b5a00";X.font="900 16px system-ui";X.fillText("$",o.x-5,y-42)}
 else if(o.type==="ghost"){X.font="48px serif";X.fillText("👻",o.x-22,y-12)}
 else if(o.type==="grave"){X.font="45px serif";X.fillText("🪦",o.x-20,y-8)}
 else if(o.type==="alien"){X.font="48px serif";X.fillText("👽",o.x-22,y-12)}
 else if(o.type==="ball"){X.font="43px serif";X.fillText("⚽",o.x-20,y-8)}
 else if(o.type==="crystal"){X.font="43px serif";X.fillText("💎",o.x-20,y-8)}
 else if(o.type==="balloon"){X.font="43px serif";X.fillText("🎈",o.x-20,y-25)}
 else if(["hurdle","barrier","gate","goal","laser"].includes(o.type)){X.fillStyle=o.type==="laser"?"#e849e8":"#f4cf48";X.fillRect(o.x-28,y-55,56,10);X.fillRect(o.x-25,y-55,6,55);X.fillRect(o.x+19,y-55,6,55)}
 else {X.font="43px serif";X.fillText("🚧",o.x-20,y-8)}
}
document.getElementById("play").onclick=()=>{audio();menu.style.display="none";intro=true;running=false;frame=0;requestAnimationFrame(loop)};
function introDraw(){bg();let shipX=Math.max(W*.62,W-frame*3);X.fillStyle="#e7eef6";X.beginPath();X.ellipse(shipX,H*.22,100,31,0,0,Math.PI*2);X.fill();X.fillStyle="#58d6ff";X.beginPath();X.ellipse(shipX,H*.20,48,22,0,Math.PI,Math.PI*2);X.fill();X.fillStyle="#17243a";X.font="900 17px system-ui";X.fillText("REBOUND",shipX-42,H*.225);if(frame>48)drawRunner(75,ground()-94,sel,frame*.35,.82);if(frame>95){intro=false;startRun()}}
function startRun(){running=true;frame=0;dist=0;objects=[];coins=0;lives=3;invuln=0;slide=0;jumpY=0;jumpV=0;target=level===1?2300:2600+level*150;speed=level<=5?[0,4.6,4.9,5.2,5.5,5.8][level]:Math.min(7.4,5.8+(level-5)*.08);hud.style.display="block"}
function gameDraw(){
 bg();frame++;dist+=speed;if(invuln>0)invuln--;if(slide>0)slide--;
 jumpV+=.62;jumpY+=jumpV;if(jumpY>0){jumpY=0;jumpV=0};jumpY=Math.max(-105,jumpY);
 if(frame%Math.max(54,92-level)===0&&dist<target-250)spawn();
 for(let o of objects){o.x-=speed;drawObj(o)}
 let px=85,py=ground()-94+jumpY;
 for(let o of objects){
   if(o.x>px-15&&o.x<px+55){
    if(o.type==="coin"){o.dead=true;coins++;coinSound();continue}
    let tall=["hurdle","barrier","gate","goal","laser"].includes(o.type);
    let avoided=tall?(slide>0||jumpY<-55):(jumpY<-48);
    if(!avoided&&invuln<=0){lives--;invuln=70;o.dead=true;crashSound();if(lives<=0){end(false);return}}
   }
 }
 objects=objects.filter(o=>!o.dead&&o.x>-70);
 X.globalAlpha=(invuln>0&&Math.floor(invuln/6)%2)?0.35:1;
 if(slide>0){X.save();X.translate(px+25,ground()-35);X.rotate(Math.PI/2);drawRunner(-25,-50,sel,frame*.43,.75);X.restore()}else drawRunner(px,py,sel,frame*.43,.82);
 X.globalAlpha=1;
 if(dist>=target){X.fillStyle="#17243a";X.fillRect(W-150,ground()-120,115,35);X.fillStyle="#fff";X.font="900 17px system-ui";X.fillText("🏁 FINISH",W-140,ground()-96);if(dist>target+380){end(true);return}}
 hud.textContent="Level "+level+" • "+Math.min(100,Math.floor(dist/target*100))+"% • 🪙 "+coins+" • ❤️ "+lives;
}
function end(win){running=false;hud.style.display="none";if(win){save.unlocked=Math.max(save.unlocked,Math.min(25,level+1));persist();msg.textContent="🏁 LEVEL COMPLETE!";msg.style.display="block";setTimeout(()=>{msg.style.display="none";menu.style.display="flex";buildMenu()},900)}else{msg.textContent="Try again!";msg.style.display="block";setTimeout(()=>{msg.style.display="none";menu.style.display="flex"},800)}}
function loop(){if(intro){frame++;introDraw()}else if(running)gameDraw();if(intro||running)requestAnimationFrame(loop)}
function doJump(){if(running&&jumpY===0)jumpV=-10.4}
C.addEventListener("pointerdown",e=>{e.preventDefault();audio();lastX=e.clientX;lastY=e.clientY},{passive:false});
C.addEventListener("pointermove",e=>e.preventDefault(),{passive:false});
C.addEventListener("pointerup",e=>{e.preventDefault();if(!running)return;let dx=e.clientX-lastX,dy=e.clientY-lastY,ax=Math.abs(dx),ay=Math.abs(dy);if(dy>35&&ay>ax){slide=42;return}if(ax<18&&ay<18)doJump()},{passive:false});
addEventListener("keydown",e=>{if(e.code==="ArrowDown")slide=42;if(e.code==="Space"||e.code==="ArrowUp")doJump()});
window.addEventListener("error",()=>{msg.textContent="Game error — reload page";msg.style.display="block"});
</script>
</body></html>
