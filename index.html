<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Runbound v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.screen{position:fixed;inset:0;background:linear-gradient(#07101df2,#101d31f2);display:flex;align-items:center;justify-content:center;padding:14px;z-index:4}
.panel{width:min(920px,97vw);max-height:94vh;overflow:auto;background:#14253d;border:1px solid #ffffff22;border-radius:24px;padding:20px;text-align:center;box-shadow:0 25px 80px #0009}
h1{font-size:44px;margin:0}.tag{opacity:.72;margin:3px 0 14px}.section{margin-top:17px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card,.world,.level,.boost{background:#203754;border:2px solid transparent;color:#fff;border-radius:14px;padding:9px;font-weight:800}
.card.sel,.level.sel{border-color:#ffe45e}.card.locked,.level:disabled{opacity:.4}.emoji{display:block;font-size:31px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.world{min-width:130px}.world.locked{opacity:.4}.world strong{display:block}.world small,.boost small{display:block;opacity:.68;font-weight:600}
.primary{background:#ffe45e;color:#142033;border:0;border-radius:14px;padding:14px 26px;font-weight:950;font-size:17px;margin:15px 5px 4px}
.hud{position:fixed;left:12px;top:12px;z-index:2;background:#07101dcc;border:1px solid #ffffff20;border-radius:12px;padding:9px 12px;font-weight:850}
.bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:7px}.bar button{border:1px solid #ffffff22;border-radius:12px;padding:10px 12px;background:#142b47;color:white;font-weight:850}.bar button:disabled{opacity:.35}
#bossHud{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:2;width:min(520px,80vw);display:none;text-align:center;font-weight:900}
#bossBar{height:14px;background:#0006;border-radius:99px;overflow:hidden;border:1px solid #fff4}#bossFill{height:100%;width:100%;background:#fff}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:5;background:#08111ddd;border-radius:14px;padding:12px 18px;font-weight:900;display:none}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:35px}.panel{padding:15px}}
</style></head>
<body>
<canvas id="game"></canvas><div class="hud" id="hud" style="display:none"></div>
<div id="bossHud">BOSS <div id="bossBar"><div id="bossFill"></div></div></div>
<div class="bar" id="boostbar" style="display:none"></div><div class="toast" id="toast"></div>
<div class="screen" id="menu"><div class="panel">
<h1>RUNBOUND</h1><div class="tag">Pop-idol supernatural runners • Dodge • Collect • Reach the finish</div>
<div>Bank: 🪙 <b id="bank"></b> &nbsp; | &nbsp; ⭐ <b id="stars"></b></div>
<div class="section"><b>Choose Runner</b><div class="grid" id="chars"></div></div>
<div class="section"><b>Worlds</b><div class="row" id="worlds"></div></div>
<div class="section"><b>Levels</b><div class="row" id="levels"></div></div>
<div class="section"><b>Boost Shop</b><div class="row" id="shop"></div></div>
<button class="primary" id="play">PLAY LEVEL</button>
<div class="tag">Tap = jump • double tap = high jump • swipe down = slide</div>
</div></div>
<script>
const C=document.getElementById('game'),X=C.getContext('2d'),DPR=()=>devicePixelRatio||1;
function resize(){C.width=innerWidth*DPR();C.height=innerHeight*DPR();X.setTransform(DPR(),0,0,DPR(),0,0)} addEventListener('resize',resize);resize();
const W=[
 {name:'Greenlands',icon:'🌳',sky:['#5bc0eb','#d9f4ff'],ground:'#2f7d45',mon:['👾','🐛','🐺'],boss:'🦖'},
 {name:'Dark Forest',icon:'🌲',sky:['#243b55','#141e30'],ground:'#24452e',mon:['🧟','🕷️','👹'],boss:'👹'},
 {name:'Ice Caves',icon:'❄️',sky:['#7fdbff','#eafaff'],ground:'#8ed8ea',mon:['🐺','👻','🧊'],boss:'🦣'},
 {name:'Volcano',icon:'🌋',sky:['#542437','#ff7043'],ground:'#51251f',mon:['🔥','👺','🐲'],boss:'🐉'},
 {name:'Monster Kingdom',icon:'🏰',sky:['#4527a0','#9c6ade'],ground:'#3d315b',mon:['👿','💀','🐲'],boss:'👑'}
];
const chars=[
['Peyton','👸🏼'],['Nova','🌙'],['Rex','🔥'],['Luna','✨'],['Bolt','⚡'],
['Milo','❄️'],['Skye','💫'],['Dash','🎤'],['Rocky','🖤'],['Ace','☀️']
];
const boosts={shield:{n:'Ghost Shield',i:'👻',d:'Invincible 10 sec',c:75},turbo:{n:'Turbo',i:'⚡',d:'Speed + score boost',c:60},magnet:{n:'Coin Magnet',i:'🧲',d:'Pull nearby coins',c:50},heart:{n:'Extra Heart',i:'❤️',d:'+1 life instantly',c:90}};
let S=JSON.parse(localStorage.getItem('runbound3')||'null')||{bank:150,stars:0,unlocked:1,shield:0,turbo:0,magnet:0,heart:0,charUnlocked:3};
function save(){localStorage.setItem('runbound3',JSON.stringify(S))}
let sel=0, level=1;
const $=id=>document.getElementById(id), menu=$('menu'),hud=$('hud'),boostbar=$('boostbar'),toast=$('toast');
function worldFor(l){return Math.floor((l-1)/5)} function showToast(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1200)}
function render(){
 $('bank').textContent=S.bank;$('stars').textContent=S.stars;
 $('chars').innerHTML=''; chars.forEach((c,i)=>{let b=document.createElement('button'),locked=i>=S.charUnlocked;b.className='card '+(i==sel?'sel ':'')+(locked?'locked':'');b.innerHTML=`<span class=emoji>${locked?'🔒':c[1]}</span>${c[0]}${locked?`<small>${(i+1)*8} ⭐</small>`:''}`;b.onclick=()=>{if(!locked){sel=i;render()}else if(S.stars>=(i+1)*8){S.stars-=(i+1)*8;S.charUnlocked=i+1;save();render()}};$('chars').appendChild(b)});
 $('worlds').innerHTML='';W.forEach((w,i)=>{let min=i*5+1,locked=S.unlocked<min,b=document.createElement('button');b.className='world '+(locked?'locked':'');b.innerHTML=`${w.icon} <strong>${w.name}</strong><small>Levels ${min}-${min+4}</small>`;b.onclick=()=>{if(!locked){level=Math.max(min,Math.min(S.unlocked,min+4));render()}};$('worlds').appendChild(b)});
 $('levels').innerHTML='';let wi=worldFor(level),start=wi*5+1;for(let l=start;l<start+5;l++){let b=document.createElement('button');b.className='level '+(l==level?'sel':'');b.disabled=l>S.unlocked;b.textContent='Level '+l;b.onclick=()=>{level=l;render()};$('levels').appendChild(b)}
 $('shop').innerHTML='';Object.entries(boosts).forEach(([k,v])=>{let b=document.createElement('button');b.className='boost';b.innerHTML=`${v.i} ${v.n}<small>${v.d}</small><small>🪙 ${v.c} • Owned ${S[k]}</small>`;b.onclick=()=>{if(S.bank>=v.c){S.bank-=v.c;S[k]++;save();render()}else showToast('Not enough coins')};$('shop').appendChild(b)})
}
render();
let running=false,frame=0,dist=0,runCoins=0,lives=3,objs=[],shots=[],speed=6,p={x:110,y:0,vy:0,slide:0},active={shield:0,turbo:0,magnet:0},boss=null,lastTap=0,sy=0;
let intro=0, introRAF=0, platforms=[], hazards=[], collapse=[], chase=null,finishShown=false;
const ground=()=>innerHeight-105;
function boostUI(){boostbar.innerHTML='';for(let [k,v] of Object.entries(boosts)){let b=document.createElement('button');b.textContent=`${v.i} ${S[k]}`;b.disabled=!S[k];b.onclick=()=>{if(!S[k])return;S[k]--;if(k==='heart')lives++;else active[k]=600;save();boostUI()};boostbar.appendChild(b)}}
function start(){
 menu.style.display='none';hud.style.display='none';boostbar.style.display='none';intro=0;running=false;
 planeIntro();
}
function beginRun(){
 hud.style.display='block';boostbar.style.display='flex';frame=dist=runCoins=0;lives=3;objs=[];shots=[];platforms=[];hazards=[];collapse=[];chase=null;finishShown=false;
 speed=({1:2.65,2:2.9,3:3.2,4:3.5,5:3.8}[level] || Math.min(5.8,3.8+(level-5)*0.10));p.y=ground()-65;p.vy=0;active={shield:0,turbo:0,magnet:0};boss=null;$('bossHud').style.display='none';running=true;boostUI();requestAnimationFrame(loop)
}

function drawHunter(x,y,i,phase=0,scale=.82){
 const hair=['#f4d06f','#30203c','#c43b48','#7754a8','#222b3a','#d7edf6','#e676ae','#31aabd','#171820','#dc7138'];
 const outfit=['#d64fa5','#6650c8','#bd3044','#8a65c5','#3266ad','#78a6c4','#dc629f','#2f9eb1','#3b3b4a','#df833f'];
 X.save(); X.translate(x,y); X.scale(scale,scale);
 let swing=Math.sin(phase)*13;
 // aura
 X.globalAlpha=.18; X.fillStyle=outfit[i]||outfit[0]; X.beginPath(); X.arc(25,37,38,0,Math.PI*2); X.fill(); X.globalAlpha=1;
 // legs
 X.strokeStyle='#1d2230'; X.lineWidth=7; X.lineCap='round';
 X.beginPath(); X.moveTo(19,51); X.lineTo(14-swing*.45,69); X.lineTo(5-swing*.7,84); X.stroke();
 X.beginPath(); X.moveTo(30,51); X.lineTo(35+swing*.45,69); X.lineTo(44+swing*.7,84); X.stroke();
 // body
 X.fillStyle=outfit[i]||outfit[0]; X.beginPath();
 if(X.roundRect){X.roundRect(10,25,29,32,8)}else{X.rect(10,25,29,32)}
 X.fill(); X.fillStyle='#171a24'; X.fillRect(11,49,27,7);
 // arms
 X.strokeStyle=outfit[i]||outfit[0]; X.lineWidth=7;
 X.beginPath(); X.moveTo(12,32); X.lineTo(2+swing*.4,48); X.stroke();
 X.beginPath(); X.moveTo(37,32); X.lineTo(47-swing*.4,46); X.stroke();
 // face + hair
 X.fillStyle='#f1c6a5'; X.beginPath(); X.arc(24,16,13,0,Math.PI*2); X.fill();
 X.fillStyle=hair[i]||hair[0]; X.beginPath(); X.arc(24,12,14,Math.PI,Math.PI*2); X.fill();
 X.fillRect(10,10,5,20); X.fillRect(33,10,5,20);
 // Peyton tiara
 if(i===0){X.fillStyle='#ffd84d';X.beginPath();X.moveTo(14,2);X.lineTo(18,-7);X.lineTo(23,0);X.lineTo(29,-8);X.lineTo(34,2);X.closePath();X.fill()}
 // energy wand
 X.strokeStyle='#fff'; X.lineWidth=3; X.beginPath(); X.moveTo(45,44); X.lineTo(56,28); X.stroke();
 X.fillStyle=outfit[i]||outfit[0]; X.beginPath(); X.arc(57,26,5,0,Math.PI*2); X.fill();
 X.restore();
}

function planeIntro(){
 intro++;
 let w=innerWidth,h=innerHeight,wo=W[worldFor(level)];
 let gr=X.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#07152f');gr.addColorStop(.55,'#173e72');gr.addColorStop(1,'#a9d7ef');
 X.fillStyle=gr;X.fillRect(0,0,w,h);
 // stars
 X.fillStyle='#fff';
 for(let k=0;k<45;k++){let sx=(k*83+intro*.35)%w,sy=(k*47)%Math.max(120,h*.58);X.globalAlpha=.35+(k%4)*.15;X.fillRect(sx,sy,2,2)}
 X.globalAlpha=1;
 X.fillStyle='#fff';X.font='900 22px system-ui';X.fillText(`LEVEL ${level} • ${wo.name}`,26,46);

 // spaceship descends and hovers
 let shipY=Math.min(h*.24, -90+intro*4.0);
 let shipX=w*.5;
 X.save();X.translate(shipX,shipY);
 X.fillStyle='#dfe8f4';X.beginPath();X.ellipse(0,0,105,34,0,0,Math.PI*2);X.fill();
 X.fillStyle='#6ad5ff';X.beginPath();X.ellipse(0,-20,54,28,0,Math.PI,Math.PI*2);X.fill();
 X.fillStyle='#17243a';X.font='900 18px system-ui';X.textAlign='center';X.fillText('REBOUND',0,7);
 X.fillStyle='#8df3ff';X.fillRect(-82,24,30,7);X.fillRect(52,24,30,7);
 X.restore();

 // tractor beam and actual character drop
 if(intro>58){
   let t=Math.min(1,(intro-58)/68);
   let dropY=shipY+35 + (ground()-85-(shipY+35))*(t*t);
   X.save();
   let beam=X.createLinearGradient(shipX,shipY+25,shipX,dropY+75);
   beam.addColorStop(0,'rgba(120,235,255,.55)');beam.addColorStop(1,'rgba(120,235,255,.05)');
   X.fillStyle=beam;X.beginPath();X.moveTo(shipX-35,shipY+24);X.lineTo(shipX-68,dropY+82);X.lineTo(shipX+68,dropY+82);X.lineTo(shipX+35,shipY+24);X.closePath();X.fill();
   X.restore();
   drawHunter(shipX-22,dropY,sel,intro*.2,.82);
 }
 if(intro<130)introRAF=requestAnimationFrame(planeIntro);
 else beginRun();
}function jump(high=false){if(!running)return;if(p.y>=ground()-66)p.vy=high?-18:-14}
C.addEventListener('pointerdown',e=>{sy=e.clientY;let n=Date.now();jump(n-lastTap<280);lastTap=n});C.addEventListener('pointerup',e=>{if(e.clientY-sy>45)p.slide=35});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump(false);if(e.code==='ArrowDown')p.slide=35;});
function spawn(){
 let wld=W[worldFor(level)],r=Math.random(),g=ground();
 if(r<.30)objs.push({t:'monster',x:innerWidth+50,y:g-52,w:50,h:50,e:wld.mon[Math.floor(Math.random()*wld.mon.length)],vx:1.5+level*.08});
 else if(r<.48){ // dangerous coin trail
   let high=Math.random()<.5; for(let j=0;j<6;j++)objs.push({t:'coin',x:innerWidth+50+j*48,y:g-(high?150+j%2*35:75),w:30,h:30,e:j==5?'💎':'🪙',val:j==5?10:1});
   if(high) hazards.push({t:'fallrock',x:innerWidth+190,y:-60,w:48,h:48,vy:2.5,e:'🪨'});
 }
 else if(r<.61)objs.push({t:'incoming',x:innerWidth+60,y:g-75-Math.random()*80,w:48,h:48,e:'🦇',vx:(level<=3?1.5+level*.10:2.5+level*.12)});
 else if(r<.73)hazards.push({t:'fallrock',x:innerWidth*.55+Math.random()*innerWidth*.35,y:-70,w:52,h:52,vy:(level<=3?1.9+level*.08:2.6+level*.07),e:'🪨'});
 else if(r<.84){platforms.push({x:innerWidth+40,y:g-120-Math.random()*70,w:150,h:20,vy:(Math.random()<.5?-1:1)*.7});}
 else if(r<.93){collapse.push({x:innerWidth+30,y:g,w:180,h:25,timer:150});}
 else objs.push({t:'rock',x:innerWidth+50,y:g-40,w:45,h:40,e:'🪨'});
 if(level>=4 && Math.random()<(level<=5?.06:.10) && !chase) chase={x:-90,y:g-62,w:60,h:60,e:'👹',life:360};
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function attack(){if(!boss||!running)return;shots.push({x:p.x+45,y:p.y+22,w:22,h:12});}
function beginBoss(){let w=W[worldFor(level)];boss={x:innerWidth-150,y:ground()-120,w:100,h:110,hp:8+worldFor(level)*4,max:8+worldFor(level)*4,e:w.boss,cool:0};$('bossHud').style.display='none';boostUI();showToast('BOSS FIGHT! Tap ATTACK')}
function end(win){running=false;let reward=0,stars=0;if(win){reward=100+level*20;stars=1;S.bank+=reward+runCoins;S.stars+=stars;if(level==S.unlocked&&S.unlocked<25)S.unlocked++;save()}else{S.bank+=runCoins;save()}setTimeout(()=>{menu.style.display='flex';hud.style.display='none';boostbar.style.display='none';$('bossHud').style.display='none';document.querySelector('.tag').textContent=win?`Level ${level} complete! +${reward+runCoins} coins • +${stars} ⭐`:`Level ${level} failed — collected ${runCoins} coins saved.`;if(win&&level<S.unlocked)level++;render()},500)}
function loop(){
 if(!running)return;frame++;let mult=active.turbo?1.5:1;let target=level<=3?3300+level*250:4300+level*250; if(!boss)dist+=speed*mult;
 if(!boss&&frame%({1:150,2:135,3:120,4:108,5:98}[level]||Math.max(68,105-level))===0)spawn();
 if(!boss && level>=3 && frame%210===0){objs.push({t:'flyer',x:innerWidth+80,y:ground()-145-Math.random()*55,w:48,h:48,e:'🦇',vx:4});}
 if(!boss && level>=4 && frame%230===0){objs.push({t:'roller',x:innerWidth+80,y:ground()-35,w:42,h:35,e:'🪵',vx:7});}
 if(!boss && level>=3 && frame%(level<5?180:120)===0){let g=ground(),wld=W[worldFor(level)];objs.push({t:'charger',x:innerWidth+70,y:g-(Math.random()<.45?125:52),w:50,h:50,e:wld.mon[Math.floor(Math.random()*wld.mon.length)],vx:level<5?2.2:3.5+level*.10});}
 p.vy+=.72;p.y+=p.vy;if(p.y>ground()-65){p.y=ground()-65;p.vy=0}if(p.slide)p.slide--;
 for(let k in active)if(active[k]>0)active[k]--;
 for(let o of objs){o.x-=speed*mult+(o.vx||0);if(active.magnet&&o.t==='coin'&&o.x<innerWidth*.75){o.x+=(p.x-o.x)*.045;o.y+=(p.y-o.y)*.045}}
 let ph={x:p.x+8,y:p.y+(p.slide?31:5),w:42,h:p.slide?30:55};
 for(let o of objs){if(o.dead)continue;if(overlap(ph,o)){if(o.t==='coin'){runCoins+=o.val;o.dead=true}else if(!active.shield){lives--;o.dead=true;if(lives<=0){end(false);return}}}}
 for(let q of hazards){if(overlap(ph,q)&&!active.shield){lives--;q.dead=true;if(lives<=0){end(false);return}}}
 if(chase&&overlap(ph,chase)&&!active.shield){lives--;chase=null;if(lives<=0){end(false);return}}
 // Moving platforms can catch the player while falling.
 for(let q of platforms){if(p.vy>=0 && p.x+45>q.x && p.x<q.x+q.w && p.y+65>=q.y && p.y+65<=q.y+18){p.y=q.y-65;p.vy=0}}
 // Collapsing ground creates a danger zone once its timer expires.
 for(let q of collapse){if(q.timer<70 && p.x+35>q.x && p.x<q.x+q.w && p.y>=ground()-70 && !active.shield){lives--;q.dead=true;p.vy=-10;if(lives<=0){end(false);return}}}
 objs=objs.filter(o=>o.x>-80&&!o.dead);platforms=platforms.filter(q=>q.x+q.w>-60);hazards=hazards.filter(q=>q.y<innerHeight+80&&!q.dead);collapse=collapse.filter(q=>q.x+q.w>-60&&!q.dead);
 
 if(dist>=target && !finishShown){
   finishShown=true; objs=[]; hazards=[]; collapse=[]; platforms=[];
 }
 if(finishShown){
   // Let the runner visibly cross a finish line before completing.
   if(dist>=target+520){end(true);return}
 }
 if(boss){boss.cool--;if(boss.cool<=0){boss.cool=90-Math.min(35,worldFor(level)*7);objs.push({t:'bossShot',x:boss.x,y:boss.y+45,w:38,h:28,e:'🔥'})}for(let s of shots)s.x+=11;for(let s of shots){if(!s.dead&&overlap(s,boss)){s.dead=true;boss.hp--;if(boss.hp<=0){end(true);return}}}shots=shots.filter(s=>s.x<innerWidth+40&&!s.dead);$('bossFill').style.width=(boss.hp/boss.max*100)+'%'}
 draw(target);requestAnimationFrame(loop)
}
function draw(target){
 let w=innerWidth,h=innerHeight,wo=W[worldFor(level)],g=ground(),gr=X.createLinearGradient(0,0,0,h);gr.addColorStop(0,wo.sky[0]);gr.addColorStop(1,wo.sky[1]);X.fillStyle=gr;X.fillRect(0,0,w,h);
 X.globalAlpha=.35;X.font='70px serif';for(let i=0;i<8;i++)X.fillText(wo.icon,((i*180-dist*.12)%(w+250))-80,g-35-(i%2)*50);X.globalAlpha=1;
 X.fillStyle=wo.ground;X.fillRect(0,g,w,h-g);X.font='42px serif';for(let o of objs)X.fillText(o.e,o.x,o.y+o.h);
 if(boss){X.font='90px serif';X.fillText(boss.e,boss.x,boss.y+90);X.font='25px serif';for(let s of shots)X.fillText('✨',s.x,s.y+18)}
 for(let q of platforms){X.fillStyle='#6b4b2a';X.fillRect(q.x,q.y,q.w,q.h);X.fillStyle='#9d7443';X.fillRect(q.x,q.y,q.w,6)}
 for(let q of hazards){X.font='44px serif';X.fillText(q.e,q.x,q.y+q.h)}
 for(let q of collapse){if(q.timer<110){X.strokeStyle='#2a1710';X.lineWidth=5;X.beginPath();X.moveTo(q.x,q.y+4);X.lineTo(q.x+45,q.y+18);X.lineTo(q.x+90,q.y+3);X.lineTo(q.x+135,q.y+19);X.stroke()}}
 if(chase){X.font='54px serif';X.fillText(chase.e,chase.x,chase.y+55)}
 X.globalAlpha=active.shield?.55:1;
 // Original pop-idol supernatural runner
 drawHunter(p.x+5,p.y-7,sel,frame*.24*(active.turbo?1.5:1),.78);
 X.globalAlpha=1;
 if(true){
   let remain=target-dist;
   if(remain<520){
     let fx=innerWidth-80+Math.max(0,remain);
     X.fillStyle='#fff';X.fillRect(fx,ground()-150,8,150);X.fillRect(fx+110,ground()-150,8,150);
     X.fillStyle='#17243a';X.fillRect(fx-8,ground()-150,134,38);
     X.fillStyle='#fff';X.font='900 18px system-ui';X.fillText('FINISH',fx+22,ground()-124);
     X.font='28px serif';X.fillText('🏁',fx+48,ground()-158);
   }
 }

}
