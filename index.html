<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>REBOUND v15</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#08152b;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(#08152be8,#203754e8)}
.panel{width:min(720px,96vw);max-height:94vh;overflow:auto;background:#142a48;border:1px solid #ffffff28;border-radius:22px;padding:18px}
h1{margin:0;font-size:42px}.tag{opacity:.75;margin:3px 0 14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card,.level{border:2px solid #ffffff24;background:#203b60;color:white;border-radius:14px;padding:10px;text-align:center}
.card.sel,.level.sel{border-color:#ffe45e}.card.locked,.level.locked{opacity:.35}
button{font:inherit}.primary{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#ffe45e;color:#17243a;font-weight:900;font-size:18px}
#hud{position:fixed;top:10px;left:10px;right:10px;display:none;z-index:3;background:#08152bbb;border-radius:12px;padding:8px 12px;font-weight:800}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);display:none;background:#08152be8;padding:12px 18px;border-radius:12px;z-index:4}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}h1{font-size:34px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div><div id="msg"></div>
<div id="menu"><div class="panel">
<h1>REBOUND</h1><div class="tag">Princess Peyton • supernatural pop-idol runners</div>
<div><b>Choose Runner</b></div><div id="chars" class="grid"></div>
<div style="margin-top:14px"><b>Choose Level</b></div><div id="levels" class="grid"></div>
<button id="play" class="primary">PLAY LEVEL</button>
<div class="tag" style="margin-top:10px">Tap = jump • double tap = higher jump • swipe down = slide</div>
</div></div>
<script>
"use strict";
const C=document.getElementById("game"),X=C.getContext("2d"),menu=document.getElementById("menu"),hud=document.getElementById("hud"),msg=document.getElementById("msg");
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;C.style.width=W+"px";C.style.height=H+"px";X.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();
const names=["Peyton","Nova","Rex","Luna","Bolt","Milo","Skye","Dash","Rocky","Ace"];
const hair=["#f5d36d","#281936","#c83d4b","#7652a8","#1d2838","#d9eff8","#ed76ae","#35b7c8","#171820","#df7438"];
const outfit=["#d84fa6","#6b4fd0","#bd3045","#8a64c8","#3166b2","#77a7c8","#dc619e","#2fa2b6","#3c3c4b","#df833f"];
let save;try{save=JSON.parse(localStorage.getItem("rebound12"))||{unlocked:1}}catch(e){save={unlocked:1}}
let sel=0,level=1,running=false,intro=false,frame=0,dist=0,speed=2.5,objects=[],p={x:100,y:0,vy:0,slide:0},lastTap=0,startY=0,finish=false,coins=0,lives=3,invuln=0;
let AC=null;
function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}
function coinSound(){let a=audio(),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(1050,a.currentTime);o.frequency.exponentialRampToValueAtTime(1650,a.currentTime+.055);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.095)}
function crashSound(){let a=audio(),n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.18,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;let g=a.createGain();g.gain.setValueAtTime(.32,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);n.connect(g);g.connect(a.destination);n.start()}

function ground(){return H-78}
function persist(){try{localStorage.setItem("rebound12",JSON.stringify(save))}catch(e){}}
function buildMenu(){
 const a=document.getElementById("chars");a.innerHTML="";
 names.forEach((n,i)=>{let b=document.createElement("button");b.className="card"+(i===sel?" sel":"");b.innerHTML=(i===0?"👸🏼":"✨")+"<br><b>"+n+"</b>";b.onclick=()=>{sel=i;buildMenu()};a.appendChild(b)});
 const l=document.getElementById("levels");l.innerHTML="";
 for(let i=1;i<=25;i++){let b=document.createElement("button");b.className="level"+(i===level?" sel":"")+(i>save.unlocked?" locked":"");b.textContent="Level "+i;b.onclick=()=>{if(i<=save.unlocked){level=i;buildMenu()}};l.appendChild(b)}
}
buildMenu();
document.getElementById("play").onclick=()=>{audio();menu.style.display="none";intro=true;running=false;frame=0;requestAnimationFrame(loop)};
function drawRunner(x,y,i,phase,scale=.8){
 X.save();X.translate(x,y);X.scale(scale,scale);
 let s=Math.sin(phase)*14, skin=i%3===0?"#e7b58f":i%3===1?"#c98f68":"#f0c7a5";
 // soft shadow
 X.fillStyle="rgba(0,0,0,.22)";X.beginPath();X.ellipse(24,88,26,6,0,0,Math.PI*2);X.fill();
 // rear leg with knee/boot
 X.strokeStyle="#242838";X.lineWidth=9;X.lineCap="round";X.beginPath();X.moveTo(27,53);X.lineTo(35+s*.38,69);X.lineTo(44+s*.7,84);X.stroke();
 X.strokeStyle="#10131c";X.lineWidth=7;X.beginPath();X.moveTo(43+s*.7,84);X.lineTo(53+s*.7,84);X.stroke();
 // torso tailored jacket
 X.fillStyle=outfit[i];X.beginPath();X.moveTo(11,28);X.quadraticCurveTo(24,21,38,29);X.lineTo(35,56);X.lineTo(14,56);X.closePath();X.fill();
 X.fillStyle="rgba(255,255,255,.28)";X.fillRect(22,29,3,24);X.fillStyle="#171b28";X.fillRect(13,51,23,7);
 // rear arm
 X.strokeStyle=skin;X.lineWidth=7;X.beginPath();X.moveTo(35,32);X.lineTo(46-s*.35,47);X.stroke();
 // front leg
 X.strokeStyle="#30364b";X.lineWidth=9;X.beginPath();X.moveTo(18,54);X.lineTo(12-s*.42,69);X.lineTo(4-s*.72,83);X.stroke();
 X.strokeStyle="#10131c";X.lineWidth=7;X.beginPath();X.moveTo(3-s*.72,83);X.lineTo(13-s*.72,83);X.stroke();
 // neck and head
 X.fillStyle=skin;X.fillRect(20,20,8,9);X.beginPath();X.ellipse(24,14,12,14,0,0,Math.PI*2);X.fill();
 // nose/eye detail
 X.fillStyle="#47342f";X.beginPath();X.arc(28,13,1.2,0,Math.PI*2);X.fill();X.strokeStyle="#a36f5d";X.lineWidth=1.2;X.beginPath();X.moveTo(31,15);X.lineTo(34,17);X.lineTo(30,18);X.stroke();
 // layered hair
 X.fillStyle=hair[i];X.beginPath();X.arc(23,9,13,Math.PI,Math.PI*2);X.fill();X.beginPath();X.moveTo(11,8);X.quadraticCurveTo(6,22,13,31);X.lineTo(17,23);X.closePath();X.fill();X.beginPath();X.moveTo(34,7);X.quadraticCurveTo(42,20,34,31);X.lineTo(31,22);X.closePath();X.fill();
 // front arm / glove
 X.strokeStyle=skin;X.lineWidth=7;X.beginPath();X.moveTo(13,32);X.lineTo(3+s*.35,48);X.stroke();X.fillStyle="#171b28";X.beginPath();X.arc(3+s*.35,49,4,0,Math.PI*2);X.fill();
 // Peyton tiara
 if(i===0){X.fillStyle="#ffd84d";X.beginPath();X.moveTo(13,1);X.lineTo(17,-7);X.lineTo(22,0);X.lineTo(28,-8);X.lineTo(34,1);X.closePath();X.fill()}
 X.restore();
}
function sky(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0a1c43");g.addColorStop(1,"#6ab8dc");X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle="#fff";for(let i=0;i<25;i++)X.fillRect((i*97+frame*.1)%W,(i*43)%(H*.55),2,2)}
function introDraw(){
 sky();let sy=Math.min(H*.22,-80+frame*4),sx=W*.5;
 X.fillStyle="#e4edf6";X.beginPath();X.ellipse(sx,sy,105,34,0,0,Math.PI*2);X.fill();X.fillStyle="#66d8ff";X.beginPath();X.ellipse(sx,sy-20,52,27,0,Math.PI,Math.PI*2);X.fill();
 X.fillStyle="#17243a";X.font="900 18px system-ui";X.textAlign="center";X.fillText("REBOUND",sx,sy+7);X.textAlign="left";
 if(frame>45){let t=Math.min(1,(frame-45)/65),y=sy+35+(ground()-82-(sy+35))*t*t;X.fillStyle="rgba(120,235,255,.18)";X.beginPath();X.moveTo(sx-32,sy+25);X.lineTo(sx-70,y+85);X.lineTo(sx+70,y+85);X.lineTo(sx+32,sy+25);X.fill();drawRunner(sx-20,y,sel,frame*.2)}
 X.fillStyle="#fff";X.font="800 20px system-ui";X.fillText("LEVEL "+level,20,38);
 if(frame>115){intro=false;startRun()}
}
function startRun(){running=true;frame=0;dist=0;finish=false;objects=[];coins=0;lives=3;invuln=0;p.y=ground()-70;p.vy=0;speed=level<=5?[0,3.42,3.72,4.02,4.32,4.62][level]:Math.min(6.96,4.62+(level-5)*.12);hud.style.display="block"}
function spawn(){
 let r=Math.random(),x=W+60,g=ground();
 if(r<.38)objects.push({t:"coin",x,y:g-90,w:28,h:28});
 else if(r<.64)objects.push({t:"rock",x,y:g-38,w:42,h:38});
 else if(r<.82)objects.push({t:"monster",x,y:g-52,w:48,h:52});
 else if(level>=3)objects.push({t:"fall",x:W*.55+Math.random()*W*.35,y:-55,w:44,h:44,vy:1.5+level*.04});
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function end(win){
 running=false;hud.style.display="none";
 if(win){save.unlocked=Math.max(save.unlocked,Math.min(25,level+1));persist();msg.textContent="🏁 LEVEL COMPLETE!";msg.style.display="block";setTimeout(()=>{msg.style.display="none";menu.style.display="flex";buildMenu()},900)}
 else{msg.textContent="Try again!";msg.style.display="block";setTimeout(()=>{msg.style.display="none";menu.style.display="flex"},800)}
}
function gameDraw(){
 sky();let g=ground();X.fillStyle="#244b39";X.fillRect(0,g,W,H-g);X.fillStyle="#5dbb63";X.fillRect(0,g, W,8);
 let target=level===1?2200:2600+level*160;dist+=speed;
 if(!finish&&dist>=target){finish=true;objects=[]}
 if(!finish&&frame%({1:132,2:122,3:112,4:104,5:98}[level]||90)===0)spawn();
 if(invuln>0)invuln--;p.vy+=.49;p.y+=p.vy;if(p.y>g-70){p.y=g-70;p.vy=0}if(p.slide>0)p.slide--;
 let ph={x:p.x+8,y:p.y+(p.slide?28:5),w:38,h:p.slide?38:62};
 for(let o of objects){o.x-=speed+(o.t==="monster"?.45:0);if(o.t==="fall"){o.y+=o.vy;o.vy+=.04}
   if(o.t==="coin"){X.fillStyle="#f6c945";X.beginPath();X.arc(o.x+14,o.y+14,13,0,Math.PI*2);X.fill();X.strokeStyle="#fff0a8";X.lineWidth=3;X.stroke();X.fillStyle="#8b6500";X.font="900 15px system-ui";X.fillText("$",o.x+9,o.y+20)}
   else if(o.t==="rock"){X.font="38px serif";X.fillText("🪨",o.x,o.y+38)}
   else if(o.t==="monster"){X.font="44px serif";X.fillText("👾",o.x,o.y+48)}
   else{X.font="40px serif";X.fillText("🪨",o.x,o.y+40)}
   if(hit(ph,o)){if(o.t==="coin"){o.dead=true;coins++;coinSound()}else if(invuln<=0){lives--;crashSound();invuln=75;o.dead=true;if(lives<=0){end(false);return}}}
 }
 objects=objects.filter(o=>!o.dead&&o.x>-70&&o.y<H+70);
 if(finish){let fx=W-(dist-target);X.fillStyle="#fff";X.fillRect(fx,g-150,7,150);X.fillRect(fx+110,g-150,7,150);X.fillStyle="#17243a";X.fillRect(fx-5,g-150,127,38);X.fillStyle="#fff";X.font="900 18px system-ui";X.fillText("FINISH",fx+22,g-124);if(fx+110<p.x){end(true);return}}
 X.globalAlpha=(invuln>0&&Math.floor(invuln/6)%2)?0.35:1;drawRunner(p.x,p.y-8,sel,frame*.23);X.globalAlpha=1;
 hud.textContent="Level "+level+"  •  "+Math.min(100,Math.floor(dist/target*100))+"%  •  🪙 "+coins+"  •  ❤️ "+lives;
}
function loop(){frame++;if(intro)introDraw();else if(running)gameDraw();if(intro||running)requestAnimationFrame(loop)}
function jump(high=false){if(!running)return;if(p.y>=ground()-72){p.vy=high?-16.2:-12.8}}
C.addEventListener("pointerdown",e=>{audio();startY=e.clientY;let n=performance.now();jump(n-lastTap<280);lastTap=n});
C.addEventListener("pointerup",e=>{if(running&&e.clientY-startY>45)p.slide=35});
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp")jump(false);if(e.code==="ArrowDown")p.slide=35});
window.addEventListener("error",()=>{msg.textContent="Game error — reload page";msg.style.display="block"});
</script>
</body></html>
